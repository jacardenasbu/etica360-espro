const scenarios=[{"id": "orden", "num": "01", "icon": "ClipboardCheck", "title": "La orden cuestionable", "category": "Legalidad y obediencia", "time": "8–10 min", "level": "Intermedio", "focus": "Distinguir obediencia legítima de alteración de información institucional.", "takeaway": "La obediencia profesional exige legalidad, trazabilidad y respeto al conducto regular.", "nodes": {"inicio": {"heading": "El primer momento", "story": "Durante un servicio de protección, un superior solicita modificar el registro de un desplazamiento para evitar observaciones administrativas. No explica la razón y pide hacerlo de inmediato.", "question": "¿Cuál es su primera decisión?", "options": [{"id": "0", "text": "Modificar el registro y evitar preguntas.", "score": 0, "feedback": "La alteración puede comprometer la trazabilidad y la confianza en el servicio.", "next": "respuesta_riesgo"}, {"id": "1", "text": "Solicitar aclaración, conservar los hechos y acudir al conducto regular.", "score": 4, "feedback": "La respuesta protege la veracidad y permite verificar la legitimidad de la instrucción.", "next": "respuesta_favorable"}, {"id": "2", "text": "Ignorar la orden sin dejar constancia ni comunicar la situación.", "score": 2, "feedback": "No alterar el registro evita un daño, pero la omisión de comunicación deja el riesgo sin gestionar.", "next": "respuesta_riesgo"}]}, "respuesta_favorable": {"heading": "La presión aumenta", "story": "El superior insiste en que el cambio es una formalidad y le advierte que podría afectar su evaluación.", "question": "¿Cómo procede ahora?", "options": [{"id": "0", "text": "Documentar lo observado, verificar la instrucción y elevar la inquietud por el canal competente.", "score": 4, "feedback": "Actuar con evidencia y respeto reduce el riesgo de manipulación.", "next": "cierre_favorable"}, {"id": "1", "text": "Esperar a que alguien más descubra el problema.", "score": 1, "feedback": "La pasividad prolonga la inconsistencia y puede afectar el servicio.", "next": "cierre_riesgo"}, {"id": "2", "text": "Discutir públicamente con el superior y acusarlo sin verificar.", "score": 1, "feedback": "La confrontación sin soporte puede escalar el conflicto y no resuelve la inconsistencia.", "next": "cierre_riesgo"}]}, "respuesta_riesgo": {"heading": "La situación se complica", "story": "Un compañero advierte que el registro ya presenta una inconsistencia y pregunta qué ocurrió.", "question": "¿Qué acción toma para manejar esta nueva situación?", "options": [{"id": "0", "text": "Documentar lo observado, verificar la instrucción y elevar la inquietud por el canal competente.", "score": 4, "feedback": "Actuar con evidencia y respeto reduce el riesgo de manipulación.", "next": "cierre_favorable"}, {"id": "1", "text": "Esperar a que alguien más descubra el problema.", "score": 1, "feedback": "La pasividad prolonga la inconsistencia y puede afectar el servicio.", "next": "cierre_riesgo"}, {"id": "2", "text": "Discutir públicamente con el superior y acusarlo sin verificar.", "score": 1, "feedback": "La confrontación sin soporte puede escalar el conflicto y no resuelve la inconsistencia.", "next": "cierre_riesgo"}]}, "cierre_favorable": {"heading": "La rendición de cuentas", "story": "La dependencia responsable solicita una explicación escrita y un registro verificable de lo ocurrido.", "question": "¿Cómo cierra profesionalmente el caso?", "options": [{"id": "0", "text": "Presentar una relación objetiva de hechos y conservar los soportes disponibles.", "score": 4, "feedback": "La transparencia facilita la verificación y la corrección.", "next": null}, {"id": "1", "text": "Ajustar su versión para coincidir con la de otros.", "score": 0, "feedback": "La coordinación de versiones debilita la verdad y la rendición de cuentas.", "next": null}, {"id": "2", "text": "Responder solo con rumores y opiniones.", "score": 1, "feedback": "Sin hechos verificables, la gestión del caso pierde rigor.", "next": null}]}, "cierre_riesgo": {"heading": function home(){screen='home';scenario=null;selected=null;answers=[];feedback=false;render();window.scrollTo(0,0)}
function select(id){if(feedback)return;selected=id;render()}
function decide(){if(selected===null||feedback)return;const o=scenario.nodes[nodeId].options.find(x=>x.id===selected);answers.push({...o});feedback=true;render()}
function next(){if(!feedback)return;const o=answers.at(-1);if(o.next){nodeId=o.next;selected=null;feedback=false;}else screen='result';render();window.scrollTo(0,0)}
function exportCSV(){const r=evaluate();const rows=[['ÉTICA 360° – ESPRO'],['Escenario',scenario.title],['Modalidad',mode==='practice'?'Práctica':'Evaluación formativa'],['Resultado',r.percentage+'%'],['Nota formativa',r.grade+'/5,0'],['Nivel',r.level],[],['COMPETENCIA','RESULTADO'],...r.cs.map(c=>[c.label,c.percentage+'%']),[],['DECISIÓN','OPCIÓN','PUNTAJE','RETROALIMENTACIÓN'],...answers.map((a,i)=>[i+1,a.text,a.score,a.feedback]),[],['Aviso','Resultado orientativo. No se almacenan datos personales.']];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='etica360-'+scenario.id+'-resultado.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function header(){return `<header class="site-header"><div class="container header-inner"><button class="brand" data-action="home" aria-label="Volver al inicio"><img class="brand-escudo" src="./escudo-espro.jpg" alt="Escudo de ESPRO" width="46" height="46"><span class="brand-text"><strong>ÉTICA <em>360°</em></strong><small>SIMULADOR FORMATIVO · ESPRO</small></span></button><div class="header-right"><span class="header-tag">PROTECCIÓN Y SEGURIDAD</span><span class="version">VERSIÓN 1.0</span></div></div></header>`}
function homeView(){return `<section class="hero"><div class="container hero-grid"><div><div class="eyebrow"><span class="dot"></span> FORMACIÓN ÉTICA APLICADA</div><h1>Decidir bien<br><span>también protege.</span></h1><p>Explore situaciones profesionales, evalúe alternativas y comprenda las consecuencias de sus decisiones en el servicio de protección.</p><div class="hero-actions"><a href="#escenarios" class="button primary">Explorar escenarios →</a><span class="hero-hint">✓ Sin registro ni datos personales</span></div></div><div class="hero-graphic" aria-hidden="true"><div class="orb orb-one"></div><div class="orb orb-two"></div><div class="graphic-inner"><span style="font-size:75px">⬡</span><span>CRITERIO · INTEGRIDAD · CARÁCTER</span></div><div class="graphic-chip chip-top">⚖ DECISIÓN RESPONSABLE</div><div class="graphic-chip chip-bottom">◎ APRENDIZAJE APLICADO</div></div></div></section><section class="container summary-strip"><div><strong>06</strong><span>Escenarios originales</span></div><div><strong>03</strong><span>Decisiones por caso</span></div><div><strong>05</strong><span>Competencias observadas</span></div><div><strong>5,0</strong><span>Escala formativa</span></div></section><section class="container section" id="escenarios"><div class="section-top"><div><div class="section-kicker">BIBLIOTECA DE CASOS</div><h2>Elija un escenario</h2><p>Cada caso contiene rutas alternativas, consecuencias y retroalimentación contextualizada.</p></div><span class="section-count">6 EXPERIENCIAS</span></div><div class="cards">${scenarios.map(s=>`<article class="scenario-card"><div class="card-head"><div class="scenario-icon" style="font-size:25px">${icon[s.id]}</div><span class="scenario-number">CASO ${s.num}</span></div><div class="category">${escapeHTML(s.category)}</div><h3>${escapeHTML(s.title)}</h3><p>${escapeHTML(s.focus)}</p><div class="card-footer"><span>◷ ${escapeHTML(s.time)}</span><span>${escapeHTML(s.level)}</span></div><div class="card-buttons"><button class="button secondary" data-start="${s.id}" data-mode="practice">Practicar →</button><button class="button outline" data-start="${s.id}" data-mode="evaluation">Evaluarme</button></div></article>`).join('')}</div></section><section class="container info-band"><span style="font-size:22px">ⓘ</span><div><strong>Propósito académico</strong><p>Los casos son ficticios y simplificados. Las respuestas no reemplazan protocolos, normas vigentes ni el juicio del docente. La aplicación no almacena información personal ni transmite resultados.</p></div></section>`}
function playView(){const n=scenario.nodes[nodeId],o=n.options.find(x=>x.id===selected);return `<section class="container play-layout"><div class="play-main"><div class="breadcrumb"><button data-action="home">⌂ Inicio</button><span>›</span><span>Caso ${scenario.num}</span></div><div class="play-head"><div><span class="section-kicker">SIMULACIÓN · ${mode==='practice'?'MODO PRÁCTICA':'EVALUACIÓN FORMATIVA'}</span><h1>${escapeHTML(scenario.title)}</h1><p>${escapeHTML(scenario.category)}</p></div><div class="stage-pill">ETAPA ${answers.length+(feedback?0:1)} DE 3</div></div><div class="progress"><span style="width:${answers.length/3*100}%"></span></div><div class="scenario-stage"><div class="stage-label">▣ ${escapeHTML(n.heading)}</div><p class="stage-story">${escapeHTML(n.story)}</p><h2>${escapeHTML(n.question)}</h2><div class="options" role="radiogroup" aria-label="Alternativas de decisión">${n.options.map((a,i)=>`<button class="option ${selected===a.id?'selected':''}" role="radio" aria-checked="${selected===a.id}" data-choice="${a.id}" ${feedback?'disabled':''}><span class="option-letter">${'ABC'[i]}</span><span>${escapeHTML(a.text)}</span><span class="radio-circle">${selected===a.id?'✓':''}</span></button>`).join('')}</div>${feedback?`<div class="feedback ${o.score>=3?'positive':o.score===2?'neutral':'negative'}" role="status"><div class="feedback-heading">${o.score>=3?'✓':'!'} ANÁLISIS DE LA DECISIÓN</div><p>${escapeHTML(o.feedback)}</p><small>Valor pedagógico de la decisión: ${o.score}/4.</small></div>`:''}<div class="stage-actions"><button class="button primary" data-action="${feedback?'next':'decide'}" ${!feedback&&selected===null?'disabled':''}>${feedback?(o.next?'Continuar historia →':'Ver resultados →'):'Confirmar decisión →'}</button></div></div></div><aside class="play-aside"><div class="aside-card"><span class="section-kicker">OBJETIVO DEL CASO</span><h3>¿Qué está en juego?</h3><p>${escapeHTML(scenario.focus)}</p><div class="aside-divider"></div>${['Identificar el dilema','Analizar consecuencias','Decidir y reflexionar'].map((x,i)=>`<div class="aside-step"><span class="step-dot ${answers.length>=i?'complete':''}">${i+1}</span><span>${x}</span></div>`).join('')}</div><div class="aside-note"><span>⬡</span><span>Una decisión ética requiere legalidad, prudencia y responsabilidad.</span></div></aside></section>`}
function resultView(){const r=evaluate();return `<section class="container result-layout"><div class="breadcrumb"><button data-action="home">⌂ Inicio</button><span>›</span><span>Resultados</span></div><div class="result-heading"><div class="result-badge" style="font-size:29px">✦</div><span class="section-kicker">SIMULACIÓN FINALIZADA</span><h1>Su criterio, en perspectiva.</h1><p>${escapeHTML(scenario.title)} · ${mode==='practice'?'Práctica':'Evaluación formativa'}</p></div><div class="result-grid"><div class="result-card score-card"><span class="section-kicker">RESULTADO FORMATIVO</span><div class="score-number">${r.grade}<span>/5,0</span></div><div class="score-level">${r.level}</div><p>${r.percentage}% de desempeño orientativo según las alternativas seleccionadas.</p><div class="score-track"><span style="width:${r.percentage}%"></span></div></div><div class="result-card"><span class="section-kicker">PERFIL DE COMPETENCIAS</span><div class="bars">${r.cs.map(c=>`<div class="bar-row"><div><span>${escapeHTML(c.label)}</span><strong>${c.percentage}%</strong></div><div class="bar-track"><span style="width:${c.percentage}%"></span></div></div>`).join('')}</div></div></div><div class="takeaway"><span style="font-size:24px">⬡</span><div><strong>Aprendizaje central</strong><p>${escapeHTML(scenario.takeaway)}</p></div></div><div class="review"><h2>Revisión de sus decisiones</h2>${answers.map((a,i)=>`<div class="review-item"><div class="review-num">${i+1}</div><div><strong>${escapeHTML(a.text)}</strong><p>${escapeHTML(a.feedback)}</p></div><span class="review-score ${a.score>=3?'positive':a.score===2?'neutral':'negative'}">${a.score}/4</span></div>`).join('')}</div><div class="result-actions"><button class="button primary" data-action="restart">↻ Repetir escenario</button><button class="button secondary" data-action="csv">↓ Exportar resultado CSV</button><button class="button outline" data-action="home">← Otros escenarios</button></div><div class="result-disclaimer"><span>ⓘ</span><span>La calificación es orientativa y no constituye nota oficial, diagnóstico psicológico ni valoración disciplinaria. No se guardan resultados al cerrar o recargar esta página.</span></div></section>`}
function render(){root.innerHTML=header()+'<main>'+(screen==='home'?homeView():screen==='play'?playView():resultView())+'</main><footer class="footer"><div class="container footer-inner"><span>⬡ ÉTICA 360° · ESPRO</span><span>Recurso educativo de demostración · No es un sistema institucional oficial</span></div></footer>';}
root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.start)start(el.dataset.start,el.dataset.mode);else if(el.hasAttribute('data-choice'))select(el.dataset.choice);else if(el.dataset.action==='home'){if(screen==='play'&&answers.length&&!confirm('¿Salir? Se perderá el progreso de esta simulación.'))return;home()}else if(el.dataset.action==='decide')decide();else if(el.dataset.action==='next')next();else if(el.dataset.action==='restart')start(scenario.id,mode);else if(el.dataset.action==='csv')exportCSV()});
render();
</script></body></html>
